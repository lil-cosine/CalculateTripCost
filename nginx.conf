server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets, fall back to index.html for client-side routing
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls through to the backend container instead of hardcoding
    # a host/port in the React app's fetch calls
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic caching for hashed static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
