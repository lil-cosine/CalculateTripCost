services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drive_cost_db
      POSTGRES_USER: drive_cost_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive_cost_user -d drive_cost_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Remove this in prod if nothing outside the compose network needs direct DB access
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://drive_cost_user:${POSTGRES_PASSWORD:-changeme}@db:5432/drive_cost_db
      REDIS_URL: redis://redis:6379
      EIA_API_KEY: ${EIA_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  redis:
      image: redis:latest
      restart: unless-stopped
      volumes:
          - redisdata:/data
      healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 10s
          timeout: 5s
          retries: 5
volumes:
  pgdata:
  redisdata:
